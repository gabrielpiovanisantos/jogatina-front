# Stack isolada para testes de integração e E2E contra o backend real
# (repo irmão ../jogatina). Usa portas e projeto próprios e um Postgres em
# tmpfs, então os testes podem limpar/semear o banco à vontade sem tocar no
# ambiente de desenvolvimento (8080/5432).
#
#   npm run stack:test:up     # sobe e espera o backend ficar saudável
#   npm run test:integration
#   npm run test:e2e
#   npm run stack:test:down
name: jogatina-test

services:
  app:
    build: ../jogatina
    ports:
      - "18080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/jogatina_test
      SPRING_DATASOURCE_USERNAME: jogatina
      SPRING_DATASOURCE_PASSWORD: jogatina
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  db:
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_DB: jogatina_test
      POSTGRES_USER: jogatina
      POSTGRES_PASSWORD: jogatina
    ports:
      - "15432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jogatina -d jogatina_test"]
      interval: 3s
      timeout: 3s
      retries: 20
